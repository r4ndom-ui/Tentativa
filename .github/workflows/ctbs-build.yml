name: CTBS Gradle build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Upload JAR artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ctbs-build
          path: build/libs/*.jar
          if-no-files-found: error
